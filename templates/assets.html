{% extends 'base.html' %}{% block content %}<h1>Material e Patrimônio</h1><form class="card" method="post"><div class="form-grid"><p><label>Nome</label><input name="name" required></p><p><label>Patrimônio/Plaqueta</label><input name="tag" required></p><p><label>Número de série</label><input name="serial"></p><p><label>Localização</label><input name="location"></p><p><label>Responsável</label><input name="responsible"></p><p><label>Valor</label><input type="number" step=".01" name="value"></p><p><label>Status</label><select name="status"><option>Ativo</option><option>Em manutenção</option><option>Baixado</option></select></p></div><div class="actions"><button class="btn">Salvar</button><a class="btn secondary" href="{{url_for('home')}}">Cancelar</a></div></form><br><div class="card table-wrap"><table><tr><th>Item</th><th>Plaqueta</th><th>Local</th><th>Responsável</th><th>Status</th></tr>{% for x in items %}<tr><td>{{x.name}}</td><td>{{x.tag}}</td><td>{{x.location}}</td><td>{{x.responsible}}</td><td>{{x.status}}</td></tr>{% endfor %}</table></div>{% endblock %}
