{% extends 'base.html' %}{% block content %}<h1>Base de conhecimento</h1><form class="card" method="post"><div class="form-grid"><p><label>Título</label><input name="title" required></p><p><label>Tipo</label><select name="kind"><option>Artigo</option><option>Procedimento</option><option>FAQ</option><option>Manual</option><option>Relacionamento</option></select></p><p><label>Fornecedor associado (opcional)</label><select name="supplier_id"><option value="">Nenhum</option>{% for s in suppliers %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select></p></div><p><label>Conteúdo</label><textarea name="content" required></textarea></p><div class="actions"><button class="btn">Publicar</button><a class="btn secondary" href="{{url_for('home')}}">Cancelar</a></div></form><br><div class="grid">{% for x in items %}<article class="card"><span class="badge">{{x.kind}}</span><h3>{{x.title}}</h3>{% if x.supplier %}<small>Fornecedor: {{x.supplier.name}}</small>{% endif %}<p>{{x.content}}</p></article>{% endfor %}</div>{% endblock %}
