{% extends 'base.html' %}{% block content %}<h1>Gerar relatório</h1><form class="card" method="post"><h3>1. O que deseja incluir?</h3><p><label><input style="width:auto" type="checkbox" name="entries" checked> Quer adicionar entrada de produtos no relatório?</label></p><p><label><input style="width:auto" type="checkbox" name="outputs" checked> Quer adicionar saída de produtos no relatório?</label></p><p><label><input style="width:auto" type="checkbox" name="chart"> Quer adicionar um gráfico de pizza com a categoria de produto que mais saiu?</label></p><h3>2. Como deseja exibir?</h3><select name="display"><option value="ambos">Gráfico e lista completa</option><option value="grafico">Somente gráfico</option><option value="lista">Somente lista</option></select><h3>3. Qual formato?</h3><select name="format"><option value="pdf">PDF</option><option value="xlsx">Excel</option><option value="docx">Word</option></select><br><br><div class="actions"><button class="btn">Gerar documento</button><a class="btn secondary" href="{{url_for('home')}}">Cancelar</a></div></form><br><div class="card"><b>O documento terá:</b><p>Logo do cliente, título “Relatório de balanço de estoque”, data de emissão à direita e os dados selecionados.</p></div>{% endblock %}
