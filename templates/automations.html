{% extends 'base.html' %}{% block content %}<h1>Automações</h1><p>Crie regras usando perguntas simples e entidades já vinculadas.</p><form class="card" method="post"><div class="form-grid"><p><label>Nome da automação</label><input name="name" required></p><p><label>Em qual cadastro?</label><select name="entity"><option>Produtos</option><option>Entradas</option><option>Saídas</option><option>Tarefas</option><option>Patrimônio</option></select></p><p><label>Quando acontecer?</label><select name="trigger"><option>Registro criado</option><option>Registro alterado</option><option>Estoque abaixo do mínimo</option><option>Validade próxima</option><option>Tarefa vencida</option></select></p><p><label>O que o sistema fará?</label><select name="action"><option>Criar notificação</option><option>Criar tarefa</option><option>Enviar e-mail</option><option>Atualizar status</option></select></p></div><div class="actions"><button class="btn">Salvar automação</button><a class="btn secondary" href="{{url_for('home')}}">Cancelar</a></div></form><br><div class="card table-wrap"><table><tr><th>Nome</th><th>Cadastro</th><th>Quando</th><th>Ação</th></tr>{% for x in items %}<tr><td>{{x.name}}</td><td>{{x.entity}}</td><td>{{x.trigger}}</td><td>{{x.action}}</td></tr>{% endfor %}</table></div>{% endblock %}
