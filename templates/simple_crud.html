{% extends 'base.html' %}{% block content %}<h1>{{title}}</h1><form class="card" method="post"><div class="form-grid">{% for f in fields %}<p><label>{{labels[loop.index0]}}</label><input name="{{f}}" {% if loop.first %}required{% endif %}></p>{% endfor %}</div><div class="actions"><button class="btn">Salvar</button><a class="btn secondary" href="{{url_for('home')}}">Cancelar</a></div></form><br><div class="card table-wrap"><table><tr>{% for l in labels %}<th>{{l}}</th>{% endfor %}</tr>{% for x in items %}<tr>{% for f in fields %}<td>{{x|attr(f) or '-'}}</td>{% endfor %}</tr>{% endfor %}</table></div>{% endblock %}
