{% extends 'base.html' %}{% block content %}<h1>Categorias</h1><form class="card" method="post"><div class="form-grid"><p><label>Nome da categoria</label><input name="name" required></p><p><label>Descrição</label><input name="description"></p></div><div class="actions"><button class="btn">Adicionar categoria</button><a class="btn secondary" href="{{url_for('products')}}">Cancelar</a></div></form><br><div class="card table-wrap"><table><tr><th>Categoria</th><th>Descrição</th><th>Status</th></tr>{% for x in items %}<tr><td>{{x.name}}</td><td>{{x.description or '-'}}</td><td>{{'Ativa' if x.active else 'Inativa'}}</td></tr>{% endfor %}</table></div>{% endblock %}
