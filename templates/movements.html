{% extends 'base.html' %}{% block content %}<h1>Entradas e saídas</h1><form class="card" method="post"><div class="form-grid"><p><label>Produto</label><select name="product_id" required>{% for p in products %}<option value="{{p.id}}">{{p.name}} · saldo {{p.stock}}</option>{% endfor %}</select></p><p><label>Tipo</label><select name="kind"><option>Entrada</option><option>Saída</option></select></p><p><label>Quantidade</label><input type="number" step=".01" name="quantity" required></p><p><label>Motivo</label><select name="reason"><option>Compra</option><option>Venda</option><option>Consumo interno</option><option>Ajuste</option><option>Transferência</option><option>Devolução</option><option>Perda</option></select></p></div><div class="actions"><button class="btn">Registrar</button><a class="btn secondary" href="{{url_for('home')}}">Cancelar</a></div></form><br><div class="card table-wrap"><table><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Motivo</th></tr>{% for x in items %}<tr><td>{{x.created_at.strftime('%d/%m/%Y %H:%M')}}</td><td>{{x.product.name}}</td><td>{{x.kind}}</td><td>{{x.quantity}}</td><td>{{x.reason}}</td></tr>{% endfor %}</table></div>{% endblock %}
