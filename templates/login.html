<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{cfg.browser_title}}</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><style>:root{--primary:{{cfg.primary_color}};--secondary:{{cfg.secondary_color}}}.login-brand{justify-content:{{'center' if cfg.login_position=='center' else ('flex-start' if cfg.login_position=='left' else 'flex-end')}}}</style></head><body><div class="login-page"><div class="login-brand"><div>{% if cfg.login_logo %}<img class="logo-preview" src="{{url_for('static',filename='uploads/'+cfg.login_logo)}}">{% else %}<h1>{{cfg.company_name}}</h1>{% endif %}<p>Gestão inteligente de estoque e patrimônio</p></div></div><div class="login-box"><form class="card login-card" method="post"><h2>Entrar</h2>{% with msgs=get_flashed_messages(with_categories=true) %}{% for c,m in msgs %}<div class="alert {{c}}">{{m}}</div>{% endfor %}{% endwith %}<p><label>Usuário</label><input name="username" required></p><p><label>Senha</label><input type="password" name="password" required></p><button class="btn" style="width:100%">Acessar</button><small><p>Acesso inicial: admin / Admin@123</p></small></form></div></div></body></html>
