{% extends 'base.html' %}{% block content %}<h1>Tarefas</h1><form class="card" method="post"><div class="form-grid"><p><label>Título</label><input name="title" required></p><p><label>Prazo</label><input type="date" name="due_date" required></p><p><label>Prioridade</label><select name="priority"><option>Baixa</option><option selected>Média</option><option>Alta</option></select></p><p><label>Responsável</label><select name="user_id">{% for u in users %}<option value="{{u.id}}">{{u.name}}</option>{% endfor %}</select></p></div><p><label>Descrição</label><textarea name="description"></textarea></p><div class="actions"><button class="btn">Salvar</button><a class="btn secondary" href="{{url_for('home')}}">Cancelar</a></div></form><br><div class="card table-wrap"><table><tr><th>Tarefa</th><th>Responsável</th><th>Prazo</th><th>Prioridade</th><th>Status</th></tr>{% for x in items %}<tr><td>{{x.title}}</td><td>{{x.user.name}}</td><td>{{x.due_date.strftime('%d/%m/%Y')}}</td><td>{{x.priority}}</td><td><form method="post" action="{{url_for('task_toggle',i=x.id)}}"><button class="btn light">{{x.status}}</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
